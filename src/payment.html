<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRJ1 – Preise &amp; Leistungen</title>
    <meta name="description" content="Wählen Sie das Paket, das am besten zu Ihrem Projekt passt.">
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/PRJ-favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/PRJ-favicon.png">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./payment.css">
</head>
<body id="top">

    <!-- Navigation -->
    <nav class="navbar award" aria-label="Hauptnavigation">
        <div class="nav-container">
            <a href="/" class="logo-brand" aria-label="PRJ1 Startseite">
                <img id="navbarLogo" alt="PRJ1 Logo" class="navbar-logo">
            </a>
        </div>
    </nav>

    <!-- Payment status banner (success / cancelled redirect from Stripe) -->
    <div id="paymentStatus" class="payment-status" role="alert" aria-live="polite" hidden></div>

    <main id="main">

        <!-- Page header -->
        <section class="pricing-hero">
            <div class="container">
                <h1 class="pricing-title">Preise &amp; Leistungen</h1>
                <p class="pricing-subtitle">Wählen Sie das Paket, das am besten zu Ihrem Projekt passt. Einmalige Zahlung, keine versteckten Kosten.</p>
            </div>
        </section>

        <!-- Pricing cards (injected by payment.js) -->
        <section class="pricing-section" aria-label="Preispakete">
            <div class="container">
                <div class="pricing-grid" id="pricingGrid"></div>
            </div>
        </section>

        <!-- Trust / disclaimer note -->
        <section class="pricing-note">
            <div class="container">
                <ul class="pricing-trust-list" aria-label="Vertrauensmerkmale">
                    <li>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        Sichere Zahlung über Stripe
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        Alle Preise zzgl. gesetzlicher MwSt.
                    </li>
                    <li>
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Nach dem Kauf melden wir uns innerhalb von 24 h
                    </li>
                </ul>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 PRJ1. Alle Rechte vorbehalten.</p>
    </footer>

    <script type="module" src="./payment.js"></script>
</body>
</html>
